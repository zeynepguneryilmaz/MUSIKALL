name: GPCR KSP ML paired evaluation

on:
  push:
    branches: [analysis/gpcr-ksp-ml-rerun-20260907]
    paths:
      - 'ml_eval/gpcr_ksp_ml_eval.py'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn xgboost requests openpyxl
      - name: Download corrected KSP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gpcr-ksp-chunk-*
          path: ml_eval/ksp_artifacts
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34166260466
      - name: Paired KSP ML evaluation
        run: python ml_eval/gpcr_ksp_ml_eval.py
      - name: Upload final paired results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpcr-ksp-ml-final
          path: ml_eval/final_results
          if-no-files-found: warn
          retention-days: 30
