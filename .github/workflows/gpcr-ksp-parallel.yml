name: GPCR KSP parallel rerun

on:
  push:
    branches:
      - analysis/gpcr-ksp-ml-rerun-20260907
    paths:
      - 'analysis_gpcr_ksp/run_ksp_subset.py'
      - '.github/workflows/gpcr-ksp-parallel.yml'
  workflow_dispatch:

jobs:
  ksp-chunks:
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy biopython networkx requests
      - name: Recompute corrected MUSIKALL KSP chunk
        env:
          KSP_CHUNK: ${{ matrix.chunk }}
          KSP_NCHUNKS: '4'
        run: python analysis_gpcr_ksp/run_ksp_subset.py
      - name: Upload chunk outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpcr-ksp-chunk-${{ matrix.chunk }}
          path: analysis_gpcr_ksp/results_chunk_${{ matrix.chunk }}
          if-no-files-found: warn
          retention-days: 14
