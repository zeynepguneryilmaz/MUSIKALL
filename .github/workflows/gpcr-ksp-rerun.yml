name: GPCR KSP rerun

on:
  push:
    branches:
      - analysis/gpcr-ksp-ml-rerun-20260907
    paths:
      - 'analysis_gpcr_ksp/**'
      - '.github/workflows/gpcr-ksp-rerun.yml'
  workflow_dispatch:

jobs:
  rerun-ksp:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy biopython networkx requests

      - name: Recompute corrected MUSIKALL KSP
        run: |
          python analysis_gpcr_ksp/gpcr_ksp_rerun_action.py

      - name: Upload complete KSP outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpcr-musikall-ksp-results
          path: |
            analysis_gpcr_ksp/results
            analysis_gpcr_ksp/GPCR_MUSIKALL_KSP_FULL_OUTPUTS.zip
          if-no-files-found: warn
          retention-days: 14
